      href: https://link.springer.com/article/10.1007/JHEP12(2024)219
    code:
      name: GitHub
      href: https://github.com/rikab/SPECTER
    img: assets/img/specter.png
    blurb: >-
      We develop "SPECTER", an extremely fast code framework for evaluating
      the spectral EMD. We also use the Spectral EMD to define a new set of
      geometric observables, analogous to SHAPER [see below!]

  - title: "Moments of Clarity: Streamlining Latent Spaces in Machine Learning using Moment Pooling"
    date: 2024-03-13
