    tags: [ml, jets, interpretability]
    journal:
      name: Phys. Rev. D 110, 074020
      href: https://doi.org/10.1103/PhysRevD.110.074020
    code:
      name: GitHub
      href: https://github.com/rikab/MomentAnalysis
    img: assets/img/moments.png
    blurb: >-
      We propose "Moment Pooling", a multivariate-moment generalisation of
      Deep-Sets that slashes latent dimensions while preserving—and sometimes
      improving—performance. Demonstrated on quark–gluon jet classification.

  - title: "Seeing Double: Calibrating Two Jets at Once"
