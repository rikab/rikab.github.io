# ----------------------------------------------------------------------------
# Software libraries (rendered in the website's Software section).
# Each entry: name, role, install (optional), github, paper (optional cross-ref
# to a publication id), blurb.
# ----------------------------------------------------------------------------
software:
  - name: SPECTER
    role: Primary developer
    install: pip install specterpy
    github: https://github.com/rikab/SPECTER
    paper: specter
    blurb: >-
      Framework for defining, building, and efficiently evaluating spectral
      shape observables for collider physics.

  - name: SHAPER
    role: Primary developer
    install: pip install pyshaper
    github: https://github.com/rikab/SHAPER
    paper: shaper
    blurb: >-
      Shape Hunting Algorithm using Parameterized Energy Reconstruction —
      a framework for defining, building, and evaluating generalized shape
      observables.

  - name: GaussianAnsatz
    role: Primary developer
    install: pip install GaussianAnsatz
    github: https://github.com/rikab/GaussianAnsatz
    paper: frequentist-way
    blurb: >-
      Machine-learning framework for frequentist inference, complete with
      local uncertainty estimation.

  - name: ParticleLoader
    role: Primary developer
    github: https://github.com/rikab/ParticleLoader
    blurb: >-
      Library for in-line downloading of standardized particle-physics
      datasets. Still in development; partial use possible.

  - name: Energyflow
    role: Maintainer
    install: pip install energyflow
    homepage: https://energyflow.network
    github: https://github.com/thaler-lab/EnergyFlow
    blurb: >-
      Established library of jet-physics tools developed before 2020. Current
      package maintainer.
