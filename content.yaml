  # --- April Fools (joke paper; not counted, not in CV) ---
  - title: "A Search for ``New Physics'', ``Beyond the Standard Model''"
    date: 2025-04-01
    authors: Rikab Gambhir
    status: preprint
    id: april-fools-2025
    joke: true
    cv_hidden: true
    arxiv: "2503.22790"
    img: assets/img/jester.png
    blurb: >-
      In this distinguished work, I search for ``new physics'' and ``beyond the
      Standard Model'' &mdash; and find them.

  - title: "Vistas: A Visualization Interface for Particle Collision Simulations"
    date: 2026-06-17
    authors: Benoît Assi, Christian Bierlich, Rikab Gambhir, Phil Ilten, Tony Menzo, Stephen Mrenna, Manuel Szewc, Michael K. Wilkinson, Jure Zupan
    status: preprint
    arxiv: "2606.19524"
    id: vistas
    tags: [hadronization, ml, statistics]
    img: assets/img/vistas.png
    blurb: >-
        We introduce Vistas, a tool for visualizing high-energy particle physics collisions simulated by the Pythia Monte-Carlo event generator. Particles produced from each of these stages are represented as lines in an interactive three-dimensional graph structure, where each line is along the direction of its particle's three-momentum vector. The event can be rotated, translated and zoomed, and details for each particle can be accessed by selecting the relevant particle line. Additionally, particle lines from all stages of the simulation can be toggled on and off and can be filtered by particle-level kinematic selection requirements. This interactive environment provides an intuitive interpretation of Pythia simulation output, including detailed features such as color flow, beam remnants, and multiple parton interactions, making it a useful tool in physics education settings, from outreach activities to graduate particle-physics courses.


  - title: "HDSense: An efficient method for ranking observable sensitivity"
    date: 2026-02-02
    authors: Benoît Assi, Christian Bierlich, Rikab Gambhir, Phil Ilten, Tony Menzo, Stephen Mrenna, Manuel Szewc, Michael K. Wilkinson, Jure Zupan
    status: preprint
    arxiv: "2602.01509"
    id: hdsense
    tags: [hadronization, ml, statistics]
    img: assets/img/hdsense.png
    blurb: >-
       We introduce the High-Dimensional Sensitivity (HDSense) score, a computationally efficient metric for ranking observable sets using only one-dimensional histograms. We apply HDSense to rank a set observables in terms of their constraining power with respect to five parameters of the Lund string model of hadronization implemented in Pythia using simulated leptonic collider events at the Z pole.


  - title: "Resummed Distribution Functions: Making Perturbation Theory Positive and Normalized"
    date: 2025-12-05
    authors: Rikab Gambhir, Radha Mastandrea
    status: preprint
    arxiv: "2512.04160"
    id: rdf
    tags: [qcd, statistics, perturbation-theory]
    featured: true
    img: assets/img/rdf.png
    blurb: >-
      We propose a framework, the Resummed Distribution Function (RDF), that, given a fixed-order perturbative calculation for an observable to some finite order in αsαs​, will ``resum'' the expression in a way that is guaranteed to match the original expression order-by-order and be positive, normalized, and finite. The RDF also enables a more direct notion of perturbative uncertainties, as we can directly vary higher-order parameters and treat them as nuisance parameters. We demonstrate the power of the RDF ansatz by matching to thrust to O(αs3) and extracting αs​ with perturbative uncertainties by fitting the RDF to ALEPH data.

  - title: The Pareto Frontier of Resilient Jet Tagging
    date: 2025-09-23
    authors: Rikab Gambhir, Matt LeBlanc, Yuanchen Zhou
    status: preprint
    arxiv: "2509.19431"
    id: pareto
    tags: [ml, jets, robustness]
    img: assets/img/pareto.png
    blurb: >-
      We explore the trade-off between performance and resilience in jet
      tagging. We show that more ``complex'' models, while achieving a higher
      AUC on jet tagging, are more simulation dependent and this can lead to
      real downstream uncertainties that diminish their percieved performance
      advantage over simpler models.

  # --- refereed ---
  - title: Isolating Unisolated Upsilons with Anomaly Detection in CMS Open Data
    date: 2025-02-19
    authors: Rikab Gambhir, Radha Mastandrea, Ben Nachman, Jesse Thaler
    status: refereed
    arxiv: "2502.14036"
    id: upsilons
    tags: [anomaly-detection, ml, open-data, cms]
    featured: true
    journal:
      name: Phys. Rev. Lett. 135, 021902
      href: https://journals.aps.org/prl/abstract/10.1103/vvv3-5kkl
    code:
      name: GitHub
      href: https://github.com/hep-lbdl/dimuonAD/
    img: assets/img/upsilons.png
    blurb: >-
      We develop the first study of anti-isolated Upsilon decays in
      proton-proton collisions, using anomaly detection to separate signal
      from background in CMS Open Data. We, for the first time, present a
      successful application of anomaly detection to find a nontrivial signal
      in real collider data. We also develop a new method for improved
      sensitivity using full likelihood reweighting.

  - title: "SPECTER: efficient evaluation of the spectral EMD"
    date: 2024-10-07
    authors: Rikab Gambhir, Andrew Larkoski, Jesse Thaler
    status: refereed
    arxiv: "2410.05379"
    id: specter
    tags: [optimal-transport, jets, ml]
    journal:
