name: Refresh INSPIRE-HEP citation data

on:
  schedule:
    # Every Monday 09:00 UTC
    - cron: '0 9 * * 1'
  # Also runnable on demand from the GitHub UI
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Force fresh INSPIRE fetch
        run: rm -rf cache/inspire-citations/*.json || true

      - name: Build (refreshes citations + h-index)
        run: python3 scripts/build.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js cache/inspire-citations js/main.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly INSPIRE-HEP refresh"
            git push
          fi
